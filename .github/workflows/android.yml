name: Gerar APK do Android
# O app instalado abre o próprio site (GitHub Pages): melhorias no site chegam sem reinstalar.
# O APK só precisa ser gerado de novo se este arquivo, o ícone ou o nome do app mudarem.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'assets/icon-*.png'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Criar o projeto Android (Capacitor)
        run: |
          mkdir build-app && cd build-app
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp ../android/capacitor.config.json .
          cp -r ../android/www .
          npx cap add android

      - name: Ícone e número da versão
        run: |
          cd build-app/android/app
          # troca o ícone padrão pelo do app (PNG em todas as densidades)
          rm -f src/main/res/mipmap-anydpi-v26/*.xml
          for d in src/main/res/mipmap-*dpi; do
            cp ../../../assets/icon-192.png "$d/ic_launcher.png" 2>/dev/null || cp ../../../../assets/icon-192.png "$d/ic_launcher.png"
            cp "$d/ic_launcher.png" "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" build.gradle

      - name: Compilar o APK
        run: |
          cd build-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../FamiliaEmEquilibrio.apk

      - name: Publicar o APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest FamiliaEmEquilibrio.apk \
            --title "Família em Equilíbrio (Android)" \
            --notes "APK para instalar no Android. Gerado em ${{ github.run_number }}." \
            --latest=false
